<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>밍기적 숫자야구</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-wrapper">
        <nav class="left-sidebar">
            <div class="logo">⚾ mingizeok</div>
            <ul class="menu-list">
                <li class="active" onclick="location.href='index.html'">Play</li>
                <li onclick="location.href='NBB_ranking.html'">Ranking</li>
            </ul>
        </nav>

        <main class="main-content">
            <section class="game-container">
                <header>
                    <h1>숫자야구</h1>
                    <div class="toggle-wrapper">
                        <span>🏆 랭킹</span>
                        <input type="checkbox" id="ranking-toggle">
                    </div>
                </header>
                
                <div id="chat-box" class="chat-box"></div>

                <div class="chat-footer">
                    <div class="input-area">
                        <input type="text" id="user-input" placeholder="숫자를 터치하세요" maxlength="4" readonly>
                        <button id="send-btn" onclick="sendMessage()">
                            <img src="https://img.icons8.com/?size=100&id=feAIdrU9YNQM&format=png&color=FFFFFF" width="23">
                        </button>
                        <button id="give-up-btn" type="button">종료</button>
                    </div>

                    <div class="custom-keypad">
                        <div class="key-row">
                            <button type="button" onclick="appendNum(1)">1</button>
                            <button type="button" onclick="appendNum(2)">2</button>
                            <button type="button" onclick="appendNum(3)">3</button>
                        </div>
                        <div class="key-row">
                            <button type="button" onclick="appendNum(4)">4</button>
                            <button type="button" onclick="appendNum(5)">5</button>
                            <button type="button" onclick="appendNum(6)">6</button>
                        </div>
                        <div class="key-row">
                            <button type="button" onclick="appendNum(7)">7</button>
                            <button type="button" onclick="appendNum(8)">8</button>
                            <button type="button" onclick="appendNum(9)">9</button>
                        </div>
                        <div class="key-row">
                            <button type="button" class="key-special" onclick="clearAll()">C</button>
                            <button type="button" onclick="appendNum(0)">0</button>
                            <button type="button" class="key-special" onclick="deleteNum()">
                                <img src="https://img.icons8.com/?size=100&id=yqAbpAyaeDor&format=png&color=000000" width="20">
                            </button>
                        </div>
                    </div>
                </div>
            </section>
            <aside class="right-panel" id="ranking-panel">
                <h3>My Best Record</h3>
                <div style="margin: 15px 0; padding: 15px; background: #f8f9fa; border-radius: 12px;">
                    <span style="font-size: 1.2rem; font-weight: bold;">#14</span>
                    <p style="font-size: 0.8rem; color: #666;">최고 기록: 4회 성공</p>
                </div>
                <h3>🏆 TOP 10</h3>
                <ul id="ranking-list" style="list-style:none; margin-top:10px;">
                    </ul>
            </aside>
        </main>
    </div>
    <script src="NBB_script.js"></script>
</body>
</html>
